name: Validate examples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install "jsonschema[format-nongpl]>=4.18"

      - name: Validate example .beer files against the schema
        run: python scripts/validate.py examples